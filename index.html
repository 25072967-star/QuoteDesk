<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QuoteDesk: From WhatsApp enquiry to approved quotation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF1EE;--sf:#fff;--ink:#16241D;--mute:#5B6B62;--line:#D3DCD6;--br:#1F6F4A;--bri:#fff;--wn:#7A4F00;--wnb:#FBF0D6;--bd:#A63A2B;--bdb:#F9E1DD;--okb:#DDF0E5;--wa:#DCF8C6;--wai:#16241D;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101814;--sf:#18231D;--ink:#E6EFE9;--mute:#9DB0A5;--line:#2C3C33;--br:#4DB886;--bri:#08130E;--wn:#E8B64A;--wnb:#3A2E10;--bd:#F0877A;--bdb:#3E1F1A;--okb:#173326;--wa:#1F3B2C;--wai:#E6EFE9;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101814;--sf:#18231D;--ink:#E6EFE9;--mute:#9DB0A5;--line:#2C3C33;--br:#4DB886;--bri:#08130E;--wn:#E8B64A;--wnb:#3A2E10;--bd:#F0877A;--bdb:#3E1F1A;--okb:#173326;--wa:#1F3B2C;--wai:#E6EFE9;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:16px 20px;background:var(--br);color:var(--bri)}
header h1{font-size:26px;font-weight:700}header p{margin:0;opacity:.85;font-size:13px}
.who{display:flex;align-items:center;gap:8px;font-size:13px}
select,input,textarea,button{font:inherit;color:inherit}
select,input,textarea{background:var(--sf);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
header select{background:var(--sf);color:var(--ink)}
:focus-visible{outline:3px solid #E0A526;outline-offset:2px}
main{display:grid;grid-template-columns:minmax(260px,330px) 1fr;gap:16px;padding:16px 20px;max-width:1200px;margin:0 auto}
@media(max-width:820px){main{grid-template-columns:1fr}}
.pane{background:var(--sf);border:1px solid var(--line);border-radius:10px;padding:14px}
.inb{display:flex;flex-direction:column;gap:8px}
.it{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer}
.it[aria-current="true"]{border-color:var(--br);box-shadow:inset 4px 0 0 var(--br);background:var(--sf)}
.it b{display:block}.it span.t{display:block;color:var(--mute);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bg{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:99px;margin-top:4px}
.bg.ok{background:var(--okb);color:var(--br)}.bg.w{background:var(--wnb);color:var(--wn)}.bg.b{background:var(--bdb);color:var(--bd)}.bg.n{background:var(--line);color:var(--mute)}
.add{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:6px}
.add textarea{width:100%;min-height:64px}
.btn{background:var(--br);color:var(--bri);border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:6px 10px;font-weight:600;color:var(--mute);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--br)}
.msg{background:var(--wa);color:var(--wai);border-radius:10px 10px 10px 2px;padding:10px 12px;max-width:560px;white-space:pre-line}
.meta{color:var(--mute);font-size:13px;margin:6px 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{border:1px solid var(--line);border-radius:6px;padding:3px 9px;font-size:13px}
.chit{border:1px solid var(--line);border-radius:6px;padding:12px;margin-top:8px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th{text-align:left;font-size:13px;color:var(--mute);font-weight:500;padding:4px 6px;border-bottom:1px solid var(--line)}
td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
td input[type=number]{width:70px}
.tot{border-top:2px dashed var(--line);margin-top:10px;padding-top:10px;margin-left:auto;max-width:300px}
.tot div{display:flex;justify-content:space-between;padding:1px 0}.tot .g{font-weight:700;font-size:18px}
.fl{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px}
.fl li{padding:7px 10px;border-radius:6px;font-size:14px}.fl .b{background:var(--bdb);color:var(--bd)}.fl .w{background:var(--wnb);color:var(--wn)}.fl .i{background:var(--okb);color:var(--br)}
.act{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
.hint{color:var(--mute);font-size:13px}
.sent{margin-top:14px}.sent .msg{background:var(--wa)}
.foot{margin-top:14px;padding:10px 14px;font-size:13px;color:var(--mute)}
.empty{color:var(--mute);padding:20px 0}
@media (prefers-reduced-motion:no-preference){.it{transition:border-color .15s}}
</style>
<style>
:root{--bg:#F1F5FB;--sf:#fff;--ink:#14213A;--mute:#5A6A85;--line:#DCE4F0;--br:#1F5FBF;--bri:#fff;--wnb:#FDF1D8;--wn:#8A5A00;--bdb:#FBE5E0;--bd:#A63A2B;--okb:#E3EEFC;--wa:#E1F6CF;--wai:#14213A;--sh:0 1px 2px rgba(20,33,58,.06),0 8px 24px rgba(20,33,58,.07)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1626;--sf:#16213A;--ink:#E6ECF8;--mute:#9AAAC6;--line:#26344F;--br:#6EA8FF;--bri:#07122A;--okb:#1B2B4A;--sh:none}}
body{font-size:15.5px}
header{background:transparent;color:var(--ink);padding:22px 24px 6px;max-width:1200px;margin:0 auto}
.brand{display:flex;align-items:center;gap:14px}
.logo{flex:none;width:46px;height:46px;border-radius:14px;background:var(--br);color:var(--bri);display:grid;place-items:center;font:700 24px "Bricolage Grotesque",system-ui,sans-serif}
header h1{font-size:26px}header p{opacity:1;color:var(--mute)}
header #hi{margin-top:2px;font-size:14px;color:var(--ink)}
.pane{border-radius:18px;box-shadow:var(--sh);padding:20px}
.it{display:flex;gap:12px;align-items:center;border-radius:14px;border-color:transparent;background:transparent;padding:10px}
.it:hover{background:var(--bg)}
.it[aria-current="true"]{background:var(--okb);border-color:transparent;box-shadow:none}
.it>div{min-width:0}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--br);color:var(--bri);display:grid;place-items:center;font:600 13px "IBM Plex Sans",system-ui,sans-serif;font-style:normal}
.msg{border-radius:18px 18px 18px 4px;padding:12px 16px}
.btn{border-radius:99px;padding:10px 22px}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.chip{border-radius:99px;background:var(--bg);border-color:transparent;padding:4px 12px}
.chit{border-radius:14px;background:var(--bg);border-color:transparent;padding:18px}
.fl li{border-radius:10px;padding:9px 12px}
.add{border-top-color:var(--line)}
.tabs button{border-radius:8px 8px 0 0}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo" aria-hidden="true">Q</div><div><h1>QuoteDesk</h1><p>From WhatsApp enquiry to approved quotation. An Orbyte module prototype using synthetic data.</p><p id="hi"></p></div></div>
  <label class="who">Acting as
    <select id="role" aria-label="Acting as">
      <option value="staff">Aisyah (Sales staff)</option>
      <option value="owner">Mr Tan (Owner)</option>
      <option value="viewer">Auditor (Viewer)</option>
    </select>
  </label>
</header>
<main>
  <aside class="pane" aria-label="Inbox">
    <h2 style="font-size:19px;margin-bottom:10px">Today’s enquiries</h2>
    <div class="inb" id="inb"></div>
    <div class="add">
      <label for="nm"><b>Try your own message</b></label>
      <textarea id="nm" placeholder="e.g. nak 30 box ondeh dan 2 tray karipap Khamis PJ"></textarea>
      <select id="nc" aria-label="Customer"></select>
      <button class="btn" data-a="add">Add to inbox</button>
    </div>
  </aside>
  <section>
    <div class="pane">
      <div class="tabs" role="tablist">
        <button role="tab" data-a="tab" data-v="quote" id="t1">Quotation</button>
        <button role="tab" data-a="tab" data-v="log" id="t2">Activity log</button>
      </div>
      <div id="det"></div>
    </div>
    <div class="pane foot" id="foot"></div>
  </section>
</main>
<script>
const P=[
{id:'lapis',name:'Kuih lapis (box of 12)',al:['kuih lapis','kek lapis','lapis'],unit:'box',price:18,stock:120,lead:1},
{id:'pulut',name:'Pulut panggang (box of 10)',al:['pulut panggang','panggang'],unit:'box',price:22,stock:40,lead:1},
{id:'karipap',name:'Karipap sardin (tray of 30)',al:['karipap sardin','karipap','curry puff'],unit:'tray',price:35,stock:25,lead:1},
{id:'seri',name:'Seri muka (tray)',al:['seri muka','serimuka'],unit:'tray',price:30,stock:15,lead:2},
{id:'ondeh',name:'Onde-onde (box of 20)',al:['onde onde','ondeh ondeh','ondeh','onde'],unit:'box',price:16,stock:60,lead:1},
{id:'tart',name:'Tart nanas (jar of 40)',al:['pineapple tart','tart nanas','nanas tart','tart'],unit:'jar',price:38,stock:30,lead:2},
{id:'bingka',name:'Bingka ubi (whole)',al:['bingka ubi','bingka'],unit:'pcs',price:28,stock:12,lead:2},
{id:'talam',name:'Kuih talam (box of 12)',al:['kuih talam','talam'],unit:'box',price:14,stock:80,lead:1}];
const C=[
{n:'Siti Aminah',ph:'+60 11-0000 0001',tier:'Loyal',d:.05},
{n:'Lim Wei',ph:'+60 11-0000 0002',tier:'Regular',d:0},
{n:'Kedai Runcit Pak Din',ph:'+60 11-0000 0003',tier:'Wholesale',d:.10},
{n:'Nurul Huda',ph:'+60 11-0000 0004',tier:'Regular',d:0},
{n:'Daniel Raj',ph:'+60 11-0000 0005',tier:'Regular',d:0},
{n:'Aisha Karim',ph:'+60 11-0000 0006',tier:'Loyal',d:.05},
{n:'Mei Ling',ph:'+60 11-0000 0007',tier:'Regular',d:0},
{n:'Hafiz Ismail',ph:'+60 11-0000 0008',tier:'Regular',d:0},
{n:'New contact',ph:'+60 11-0000 0099',tier:'Regular',d:0}];
const PL=[['petaling jaya','PJ',15],['kuala lumpur','KL',15],['shah alam','Shah Alam',20],['johor bahru','Johor Bahru',null],['cheras','Cheras',15],['ampang','Ampang',15],['subang','Subang',18],['klang','Klang',25],['penang','Penang',null],['ipoh','Ipoh',null],['pj','PJ',15],['kl','KL',15],['jb','Johor Bahru',null]];
const WD={isnin:1,monday:1,mon:1,selasa:2,tuesday:2,tue:2,rabu:3,wednesday:3,wed:3,khamis:4,thursday:4,thu:4,jumaat:5,friday:5,fri:5,sabtu:6,saturday:6,sat:6,ahad:0,sunday:0,sun:0};
const DR=new RegExp('\\b(esok|tomorrow|tmr|lusa|'+Object.keys(WD).join('|')+')\\b');
const SW=new Set('need nak order please pls plz boss hi hello kak abang tolong buat tempah mau want untuk for of the a some with box boxes kotak tray trays dulang jar jars balang pcs biji pek pack unit units beli boleh ya la lah can get i we saya kami send salam hantar nak how much'.split(' '));
const SAMP=[
['Siti Aminah',0,'Salam kak, nak 50 box kuih lapis + 20 pulut panggang, Friday, KL',[['lapis',50],['pulut',20]]],
['Lim Wei',1,'hi boss need 3 tray karipap sardin for tomorrow, PJ',[['karipap',3]]],
['Pak Din',2,'200 box onde-onde dan 60 kuih talam, hantar Sabtu, Shah Alam',[['ondeh',200],['talam',60]]],
['Nurul Huda',3,'Nak tempah seri muka 5 tray untuk esok KL',[['seri',5]]],
['Daniel Raj',4,'need cookies for office event next week 80 pax',[[null,80]]],
['Aisha Karim',5,'Pls send 2 jars pineapple tart n 1 bingka ubi Jumaat Penang',[['tart',2],['bingka',1]]],
['Mei Ling',6,'hi, how much for kuih?',[]],
['Hafiz Ismail',7,'karipap 10 tray, ondeh 5 box, lapis 8 box Ahad Cheras',[['karipap',10],['ondeh',5],['lapis',8]]]];
const R={staff:'Aisyah (Sales staff)',owner:'Mr Tan (Owner)',viewer:'Auditor (Viewer)'};
let S={role:'staff',sel:0,tab:'quote'},E=[],L=[],N=0;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rm=n=>'RM'+n.toFixed(2);
const fd=d=>d.toLocaleDateString('en-MY',{weekday:'short',day:'numeric',month:'short'});
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
function dt(k){const d=today();if(k=='esok'||k=='tomorrow'||k=='tmr')d.setDate(d.getDate()+1);else if(k=='lusa')d.setDate(d.getDate()+2);else d.setDate(d.getDate()+((WD[k]-d.getDay()+7)%7||7));return d}
function mt(tk){const s=' '+tk.join(' ')+' ';let b=null,bl=0;
 P.forEach(p=>p.al.forEach(a=>{if(s.includes(' '+a+' ')&&a.length>bl){b=p;bl=a.length}}));
 if(b)return{p:b,c:.95};
 const c=P.filter(p=>Math.max(...p.al.map(a=>{const at=a.split(' ');return at.filter(x=>tk.includes(x)).length/at.length}))>=.5);
 return c.length==1?{p:c[0],c:.65}:null}
/* Stand-in for the AI step: reads messy text into structured fields. In production an LLM call returns the same JSON shape. */
function parse(text){
 let t=' '+text.toLowerCase().replace(/[’']/g,'').replace(/-/g,' ')+' ',date=null,place=null;
 const dm=t.match(DR);if(dm){date=dt(dm[1]);t=t.replace(dm[0],' ')}
 t=t.replace(/\b\d{1,2}(:\d\d)?\s*(am|pm)\b/g,' ');
 for(const p of PL){const r=new RegExp('\\b'+p[0]+'\\b');if(r.test(t)){place=p;t=t.replace(r,' ');break}}
 const lines=[];
 t.split(/\s*(?:\+|&|,|;|\band\b|\bdan\b|\bn\b|\bplus\b|\btambah\b)\s*/).forEach(sg=>{
  const m=sg.match(/(\d+)/),q=m?+m[1]:null;
  const tk=sg.replace(/\d+/g,' ').replace(/[^a-z ]/g,' ').split(/\s+/).filter(x=>x&&!SW.has(x));
  if(!tk.length)return;
  const r=mt(tk);if(!r&&q==null)return;
  lines.push({pid:r?r.p.id:null,qty:q,raw:sg.trim(),c:r?r.c:0})});
 return{lines,date,place}}
function calc(e){
 const f=[],c=C[e.cid];let sub=0;
 if(!e.lines.length)f.push(['b','I couldn’t find an order in this message. It may be worth asking what they’d like and how many.']);
 e.lines.forEach((l,i)=>{const p=P.find(x=>x.id==l.pid),n='Line '+(i+1)+': ';
  if(!p){f.push(['b',n+'no catalogue match for “'+l.raw+'”. Pick an item or ask the customer.']);return}
  if(!l.qty){f.push(['b',n+'quantity missing for '+p.name+'.']);return}
  sub+=p.price*l.qty;
  if(l.qty>p.stock)f.push(['w',n+'only '+p.stock+' '+p.unit+' in stock but '+l.qty+' requested.']);
  if(l.c<.8)f.push(['w',n+'matched by similarity only, please check the item.'])});
 if(e.lines.length){
  if(!e.date)f.push(['w','No delivery date given. Confirm with the customer.']);
  else{const days=Math.round((e.date-today())/864e5),ml=Math.max(0,...e.lines.map(l=>(P.find(x=>x.id==l.pid)||{lead:0}).lead));
   if(days<ml)f.push(['w','Needs '+ml+' day(s) notice but delivery is in '+days+'.'])}
  if(!e.place)f.push(['w','No delivery location. Pickup assumed, please confirm.']);
  else if(e.place[2]==null)f.push(['w',e.place[1]+' is outside the delivery zones. Fee must be set by the owner.'])}
 const fee=e.place&&e.place[2]||0,disc=sub*c.d,total=sub-disc+fee;
 if(total>500)f.push(['w','This one is over RM500, so the owner should take a look.']);
 if(c.d)f.push(['i',c.tier+' customer: '+(c.d*100)+'% discount applied.']);
 Object.assign(e,{flags:f,sub,disc,fee,total})}
function mk(text,cid,ex){const r=parse(text);const e={id:++N,cid,text,st:'pending',lines:r.lines,date:r.date,place:r.place,time:new Date()};calc(e);
 log('System','Auto','Read message, found '+e.lines.length+' line(s), '+e.flags.filter(x=>x[0]!='i').length+' flag(s)',e);return e}
function log(who,role,act,e){L.push({t:new Date(),who,role,act,q:'Q-'+(1000+e.id)})}
function who(){return R[S.role].split(' (')[0]}
function why(e){if(e.st!='pending')return'';if(S.role=='viewer')return'You have view-only access, so you can look but not make changes.';
 if(e.flags.some(f=>f[0]=='b'))return'Please sort out the red items first.';
 if(e.flags.some(f=>f[0]=='w')&&S.role!='owner')return'Because of the warnings, this one needs the owner’s sign-off.';return null}
function badge(e){if(e.st=='sent')return['ok','Sent'];if(e.st=='rejected')return['n','Rejected'];if(e.st=='waiting')return['w','Waiting for customer'];
 if(e.flags.some(f=>f[0]=='b'))return['b','Needs a look'];if(e.flags.some(f=>f[0]=='w'))return['w','For the owner'];return['ok','Ready for you']}
function ph(c){return S.role=='viewer'?'+60 ••-•••• '+c.ph.slice(-4):c.ph}
function bubble(e){const c=C[e.cid];let s='Hi '+c.n.split(' ')[0]+'! Here is your quotation Q-'+(1000+e.id)+':\n';
 e.lines.forEach(l=>{const p=P.find(x=>x.id==l.pid);s+='• '+l.qty+' × '+p.name+' = '+rm(p.price*l.qty)+'\n'});
 if(e.disc)s+='Discount: −'+rm(e.disc)+'\n';
 if(e.place)s+='Delivery to '+e.place[1]+(e.date?' on '+fd(e.date):'')+': '+rm(e.fee)+'\n';
 return s+'Total: '+rm(e.total)+'\nValid for 3 days. Reply YES to confirm.'}
function render(){
 const pn=E.filter(x=>x.st=='pending').length;document.getElementById('hi').textContent='Hello, '+who()+'. '+(pn?pn+' enquiries are waiting for a reply.':'You’re all caught up.');
 document.getElementById('t1').setAttribute('aria-selected',S.tab=='quote');
 document.getElementById('t2').setAttribute('aria-selected',S.tab=='log');
 document.getElementById('inb').innerHTML=E.map((e,i)=>{const b=badge(e);return'<button class="it" data-a="sel" data-v="'+i+'" aria-current="'+(i==S.sel)+'"><i class="av">'+esc(C[e.cid].n.split(' ').map(w=>w[0]).slice(0,2).join(''))+'</i><div><b>'+esc(C[e.cid].n)+'</b><span class="t">'+esc(e.text)+'</span><span class="bg '+b[0]+'">'+b[1]+'</span></div></button>'}).join('');
 const d=document.getElementById('det');
 if(S.tab=='log'){d.innerHTML='<h2 style="font-size:20px">Activity log</h2><p class="meta">Every action is recorded with who did it and when. Entries cannot be edited.</p><div class="tw"><table><tr><th>Time</th><th>Person</th><th>Role</th><th>Action</th><th>Quote</th></tr>'+L.slice().reverse().map(x=>'<tr><td>'+x.t.toLocaleTimeString('en-MY')+'</td><td>'+esc(x.who)+'</td><td>'+esc(x.role)+'</td><td>'+esc(x.act)+'</td><td>'+x.q+'</td></tr>').join('')+'</table></div>';return}
 const e=E[S.sel];if(!e){d.innerHTML='<p class="empty">Select an enquiry to see its quotation.</p>';return}
 const c=C[e.cid],edit=e.st=='pending'&&S.role!='viewer',w=why(e),b=badge(e);
 let h='<h2 style="font-size:20px">Quotation Q-'+(1000+e.id)+' <span class="bg '+b[0]+'">'+b[1]+'</span></h2>';
 h+='<p class="meta">'+esc(c.n)+' · '+esc(c.tier)+' customer · '+esc(ph(c))+'</p><div class="msg">'+esc(e.text)+'</div>';
 h+='<div class="chips"><span class="chip">Delivery date: '+(e.date?fd(e.date):'not found')+'</span><span class="chip">Location: '+(e.place?e.place[1]+(e.place[2]!=null?' ('+rm(e.place[2])+')':' (outside zone)'):'not found')+'</span></div>';
 h+='<div class="chit"><div class="tw"><table><tr><th>Item</th><th>Qty</th><th class="r">Unit price</th><th class="r">Amount</th><th>Read as</th><th></th></tr>';
 e.lines.forEach((l,i)=>{const p=P.find(x=>x.id==l.pid);
  h+='<tr><td>'+(edit?'<select data-i="'+i+'" data-f="pid" aria-label="Item"><option value="">Choose item…</option>'+P.map(x=>'<option value="'+x.id+'"'+(x.id==l.pid?' selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select>':esc(p?p.name:'(no match)'))+'</td>';
  h+='<td>'+(edit?'<input type="number" min="1" data-i="'+i+'" data-f="qty" value="'+(l.qty||'')+'" aria-label="Quantity">':(l.qty||'?'))+'</td>';
  h+='<td class="r">'+(p?rm(p.price):'')+'</td><td class="r">'+(p&&l.qty?rm(p.price*l.qty):'')+'</td>';
  h+='<td>'+(!p?'<span class="bg b">No match</span>':l.c<.8?'<span class="bg w">Check</span>':'<span class="bg ok">Matched</span>')+'</td>';
  h+='<td>'+(edit?'<button class="btn ghost" data-a="del" data-v="'+i+'" aria-label="Remove line">×</button>':'')+'</td></tr>'});
 if(!e.lines.length)h+='<tr><td colspan="6" class="hint">No order lines found.</td></tr>';
 h+='</table></div><div class="tot"><div><span>Subtotal</span><span>'+rm(e.sub)+'</span></div>'+(e.disc?'<div><span>Discount</span><span>−'+rm(e.disc)+'</span></div>':'')+'<div><span>Delivery</span><span>'+rm(e.fee)+'</span></div><div class="g"><span>Total</span><span>'+rm(e.total)+'</span></div></div></div>';
 if(e.flags.length)h+='<ul class="fl" aria-label="Checks">'+e.flags.map(f=>'<li class="'+f[0]+'">'+esc(f[1])+'</li>').join('')+'</ul>';
 if(e.st=='pending'){h+='<div class="act"><button class="btn" data-a="appr"'+(w?' disabled':'')+'>Approve and send</button><button class="btn ghost" data-a="ask"'+(S.role=='viewer'?' disabled':'')+'>Ask customer</button><button class="btn ghost" data-a="rej"'+(S.role=='viewer'?' disabled':'')+'>Reject</button>'+(w?'<span class="hint">'+esc(w)+'</span>':'')+'</div>'}
 else if(e.st=='sent')h+='<div class="sent"><p class="hint">Sent preview. Approved by '+esc(e.by)+'.</p><div class="msg">'+esc(bubble(e))+'</div></div>';
 else h+='<p class="hint">'+(e.st=='waiting'?'Clarification requested by '+esc(e.by)+'. Message draft: “Hi '+esc(c.n.split(' ')[0])+', could you confirm the item and quantity you need?”':'Rejected by '+esc(e.by)+'.')+'</p>';
 d.innerHTML=h}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b||b.tagName=='SELECT')return;const a=b.dataset.a,e=E[S.sel];
 if(a=='sel'){S.sel=+b.dataset.v;S.tab='quote'}
 else if(a=='tab')S.tab=b.dataset.v;
 else if(a=='del'){e.lines.splice(+b.dataset.v,1);calc(e);log(who(),S.role,'Removed a line',e)}
 else if(a=='appr'){if(why(e)!==null)return;const ov=e.flags.some(f=>f[0]=='w');e.st='sent';e.by=R[S.role];log(who(),S.role,'Approved and sent quotation, '+rm(e.total)+(ov?' (owner override of warnings)':''),e)}
 else if(a=='rej'){e.st='rejected';e.by=R[S.role];log(who(),S.role,'Rejected quotation',e)}
 else if(a=='ask'){e.st='waiting';e.by=R[S.role];log(who(),S.role,'Asked customer to clarify',e)}
 else if(a=='add'){const v=document.getElementById('nm').value.trim();if(!v)return;E.unshift(mk(v,+document.getElementById('nc').value));document.getElementById('nm').value='';S.sel=0;S.tab='quote'}
 render()});
document.addEventListener('change',ev=>{const t=ev.target;
 if(t.id=='role'){S.role=t.value;render();return}
 if(t.dataset.i==null)return;const e=E[S.sel],l=e.lines[+t.dataset.i];
 if(t.dataset.f=='pid'){l.pid=t.value||null;l.c=l.pid?1:0}else{l.qty=+t.value||null;if(l.pid)l.c=1}
 calc(e);log(who(),S.role,'Edited line '+(+t.dataset.i+1),e);render()});
document.getElementById('nc').innerHTML=C.map((c,i)=>'<option value="'+i+'"'+(i==C.length-1?' selected':'')+'>'+esc(c.n)+' ('+c.tier+')</option>').join('');
let ok=0,tot=0;
SAMP.forEach(s=>{const e=mk(s[2],s[1]);E.push(e);const ex=s[3];
 if(!ex.length){tot++;if(!e.lines.length)ok++}
 else ex.forEach((x,i)=>{tot++;const l=e.lines[i];if(l&&l.pid===x[0]&&l.qty===x[1])ok++})});
document.getElementById('foot').innerHTML='<b>Parser check:</b> '+ok+' of '+tot+' expected items read correctly across '+SAMP.length+' test messages. Hub data used: product catalogue, customer records, user roles. All data here is synthetic. In a real deployment: collect only what a quotation needs, use customer consent for WhatsApp contact, restrict phone numbers by role, and set a retention period (PDPA principles).';
render();
</script>
